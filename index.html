<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JVL QI Management - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .bg-gradient-custom {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #047857 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gradient-custom min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel rounded-2xl shadow-2xl w-full max-w-md p-8 transform transition-all">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <img src="https://www.rploei.go.th/ec2/wp-content/uploads/2017/08/cropped-cropped-cropped-3.png" 
                 alt="Logo" class="w-24 h-24 mx-auto mb-4 drop-shadow-md rounded-full border-2 border-green-500 p-1">
            <h1 class="text-2xl font-bold text-gray-800">JVL QI Management</h1>
            <p class="text-sm text-gray-500 mt-2">ระบบบริหารจัดการกลุ่มภารกิจพัฒนาสู่ความเป็นเลิศ<br>รพ.จิตเวชเลยราชนครินทร์</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            
            <button type="submit" 
                class="w-full bg-gradient-to-r from-blue-600 to-green-600 hover:from-blue-700 hover:to-green-700 text-white font-medium py-2.5 rounded-lg shadow-lg transition-all duration-300 transform hover:-translate-y-0.5">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- Divider -->
        <div class="mt-6 flex items-center justify-center space-x-2">
            <span class="h-px bg-gray-300 w-full"></span>
            <span class="text-gray-400 text-sm">หรือ</span>
            <span class="h-px bg-gray-300 w-full"></span>
        </div>

        <!-- Guest Login -->
        <button type="button" onclick="loginAsGuest()"
            class="mt-6 w-full bg-white border-2 border-gray-200 text-gray-600 hover:bg-gray-50 font-medium py-2.5 rounded-lg transition-colors flex justify-center items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            เข้าชมแบบ Guest (View Only)
        </button>
    </div>

    <script>
        // สมมติ URL ของ Web App ที่ได้จาก Apps Script
        const API_URL = 'https://script.google.com/macros/s/AKfycbxsOV5e5N46UYeAg2et9Q2kQCeZF-PY6hfcKVv_-YUPCy2lDRjMNMj8PZxrX14ksi1zzw/exec';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // แสดง Loading
            Swal.fire({
                title: 'กำลังตรวจสอบข้อมูล...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // ส่ง Ajax Request
            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'login',
                    payload: { username: user, password: pass }
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    // เก็บ Session ลง LocalStorage
                    localStorage.setItem('jvl_user', JSON.stringify(data.user));
                    Swal.fire({
                        icon: 'success', title: 'เข้าสู่ระบบสำเร็จ', 
                        showConfirmButton: false, timer: 1500
                    }).then(() => {
                        window.location.href = 'dashboard.html'; // เปลี่ยนไปหน้า App หลัก
                    });
                } else {
                    Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบล้มเหลว', text: data.message });
                }
            })
            .catch(error => {
                Swal.fire({ icon: 'error', title: 'ข้อผิดพลาดเครือข่าย', text: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้' });
            });
        });

        function loginAsGuest() {
            localStorage.setItem('jvl_user', JSON.stringify({ role: 'Guest', name: 'ผู้เข้าชมทั่วไป' }));
            window.location.href = 'dashboard.html'; // ไปหน้า Dashboard โดยมีสิทธิ์จำกัด
        }
    </script>
</body>
</html>
